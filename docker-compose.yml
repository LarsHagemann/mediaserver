# docker compose config to run a development instance
# of the mediaserver tool

services:
  server:
    build: 
      dockerfile: Dockerfile.server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT}/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    working_dir: /app
    command: npm run dev
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MIGRATIONS_DIR: assets/db/migrations
      DEFAULT_THUMBNAIL_PATH: assets/icons/unknown_file.jpg
      DOCUMENT_STORE_CONFIG_PATH: assets/documentStoreConfig.json
      IGNORE_MIGRATION_CHECKSUM_MISMATCHES: true
      MAX_FILE_UPLOAD_SIZE: 2147483648 # 2GB
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:5173
      # IdP — set IDP_ENABLED=true to activate OIDC login (requires '127.0.0.1 keycloak' in /etc/hosts)
      IDP_ENABLED: false
      IDP_OIDC_DISCOVERY_URL: http://keycloak:8100/realms/mediaserver/.well-known/openid-configuration
      IDP_CLIENT_ID: mediaserver-app
      IDP_CLIENT_SECRET: "dein-sicheres-secret-hier"
      IDP_REDIRECT_URI: http://localhost:${BACKEND_PORT}/auth/callback
      IDP_FRONTEND_URL: http://localhost:5173
      IDP_ADMIN_USER_IDS: ceac4763-4524-4961-8ec2-4e0ea15e241e
      IDP_REGISTRATION_ALLOWED: true
    volumes:
      - ./server:/app:z
      - server_data:/store-0
      - /tmp:/tmp
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
      - ${WEBSOCKET_PORT}:${WEBSOCKET_PORT}

  frontend:
    image: docker.io/library/node:20
    depends_on:
      server:
        condition: service_healthy
    restart: always
    working_dir: /app
    command: npm run dev
    volumes:
      - ./frontend:/app:z
    environment:
      VITE_BACKEND_URL: "http://localhost:${BACKEND_PORT}"
      VITE_WEBSOCKET_URL: "ws://localhost:${WEBSOCKET_PORT}"
    ports:
      - 5173:5173

  postgres:
    image: docker.io/library/postgres:16
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  # Keycloak dev IdP — browse to http://keycloak:8100/admin (admin/admin) after adding
  # '127.0.0.1 keycloak' to /etc/hosts on your host machine.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8100
    restart: always
    volumes:
      - ./devops/keycloak:/opt/keycloak/data/import:z
      - keycloak_data:/opt/keycloak/data
    ports:
      - 8100:8100

  redis:
    image: docker.io/library/redis:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    env_file:
      - .env
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  server_dist:
  redis_data:
  server_data:
  keycloak_data:
